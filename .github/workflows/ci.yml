name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly: cargo-audit
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # fmt / clippy / tests (benchs stay out of CI: criterion noise).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features

  audit:
    # Weekly dependency audit (cargo-audit).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked || true
      - run: cargo audit

  musl:
    # Static linux binaries on tags only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: newppp-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/newppp
