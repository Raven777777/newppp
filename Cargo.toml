[package]
name = "newppp"
version = "0.1.0"
edition = "2021"
description = "Industrial WebTransport-based proxy: SOCKS5/HTTP inbound, WT(h3) primary + HTTPS POST fallback outbound"
license = "MIT OR Apache-2.0"

[[bin]]
name = "newppp"
path = "src/main.rs"
bench = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "http2",
    "native-tokio",
    "tls12",
    "logging",
] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
quinn-proto = "0.11"
rand = "0.8"
rustls-native-certs = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wtransport = { version = "0.7", features = ["dangerous-configuration", "quinn"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "frame"
harness = false

[profile.release]
lto = "thin"
strip = true
