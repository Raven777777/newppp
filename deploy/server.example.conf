# =============================================================================
# newppp 服务端示例配置
# =============================================================================
# 使用方法：
#   1) 复制到受保护的位置，例如 /etc/newppp/server.conf（建议权限 600）；
#   2) 替换下面的账号密码与证书路径；
#   3) 启动：newppp --config /etc/newppp/server.conf
#
# 语法说明：
#   * 每行格式为 KEY = VALUE，KEY 即命令行长选项名（去掉前缀 --）。
#   * 以 # 开头的整行是注释，空行忽略。
#     注意：注释必须单独成行——不写引号时，行内 # 之后的内容会被当成值的一部分。
#   * 布尔开关整行只写键名（也可写 KEY = true），不要给它赋值。
#   * 值可以用成对引号（'…' 或 "…"）包裹；引号之后的内容当作注释。
#   * 命令行参数优先于本文件；同一文件里靠后的同名键覆盖靠前的；auth 可多行叠加。
# =============================================================================

# 运行模式：server（等价于命令行 -s）
mode = server

# -----------------------------------------------------------------------------
# 认证（必填，可多行注册多用户）
# -----------------------------------------------------------------------------
# uid 限 [A-Za-z0-9_-]{1,32}。密码是内层加密密钥的根：请用足够长且随机的字符串。
auth = alice:CHANGE_THIS_PASSWORD
# auth = bob:ANOTHER_STRONG_PASSWORD

# -----------------------------------------------------------------------------
# 监听地址（listen 与 fallback-listen 至少配置一个）
# -----------------------------------------------------------------------------
# WebTransport（QUIC/UDP）主通道。省略则完全不监听 UDP（纯网站形态 B）。
# 注意：只取端口，IP 部分被忽略（总是绑定全部接口）；需要限定地址请用防火墙收敛。
listen = 0.0.0.0:443

# TLS TCP：模式 A 降级（双工 POST）+ WebSocket + 未认证访问的伪装站。
fallback-listen = 0.0.0.0:443

# 80 门面：一切请求 301 跳到 https（带 HSTS），可选 ACME http-01 验证；
# 明文 API 在此端口不可用。
http-listen = 0.0.0.0:80

# Let's Encrypt http-01 验证文件目录（certbot --webroot -w 该目录）：
# acme-dir = /var/www/acme

# -----------------------------------------------------------------------------
# TLS 证书
# -----------------------------------------------------------------------------
# 生产使用正式证书；--cert/--key 的文件存在性会在监听绑定前校验，路径写错直接退出。
cert = /etc/newppp/cert.pem
key = /etc/newppp/key.pem

# 开发调试用内存自签证书（客户端需加 --skip-verify；生产禁用）：
# self-signed

# -----------------------------------------------------------------------------
# 降级端点路径（客户端 --url 的路径需与此一致）
# -----------------------------------------------------------------------------
path = /api/ppp

# -----------------------------------------------------------------------------
# 容量与限额
# -----------------------------------------------------------------------------
# 全局并发会话上限
max-sessions = 200

# 全局并发「未认证」连接上限（已接入但尚未通过 AUTH 帧）；
# 每源 IP 上限为其 1/8（2..64）。认证成功后立即释放，不挤占已认证会话。
max-unauth = 128

# 每用户限速 Mbps（0 表示不限）：同一 uid 的全部连接共享一个令牌桶，
# 覆盖 TCP 上/下行与 UDP 中转全部流量。
rate = 100

# 空闲会话回收秒数；无会话且无数据活动的空连接按 3 倍时长回收。
idle = 60

# UDP 目标的域名解析缓存 TTL 秒（0 关闭缓存）：命中缓存的域名不再逐包查询。
udp-dns-ttl = 3600

# -----------------------------------------------------------------------------
# 传输调优
# -----------------------------------------------------------------------------
# QUIC 每流接收窗口 MB（1..=64，上传方向）：高丢包调小抗 "too many gaps"，
# 优质高延迟线路可调大提速。
recv-window = 2

# 明文帧负载上限 KB（16..=1024，默认 16）：
#   与客户端握手协商取小值（协议 v2），两端都调大才生效；
#   调大后，大 UDP 数据报可整帧走可靠流，不再被丢弃。
# max-frame-kb = 16

# -----------------------------------------------------------------------------
# 出站策略
# -----------------------------------------------------------------------------
# 默认拒绝访问回环、私网、链路本地、云 metadata 等非公网目标（防 SSRF）。
# 仅本地联调或明确的内网代理场景才放开：
# allow-private-targets

# -----------------------------------------------------------------------------
# 收尾与观测
# -----------------------------------------------------------------------------
# 优雅停机：取消在途连接后最多再排空的秒数，超时强杀（配合 systemd TimeoutStopSec）
shutdown-grace = 10

# 健康端点（明文 HTTP，建议仅回环）：/healthz 返回 JSON 运行时快照
health = 127.0.0.1:9100

# 日志级别：trace | debug | info | warn | error
log = info

# 内部时钟的时间源 URL（HTTP Date 头校准），默认 Cloudflare。
# 国内可换成淘宝时间接口：
# time = https://acs.m.taobao.com/gw/mtop.common.getTimestamp/
