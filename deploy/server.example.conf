# newppp server example configuration
# Copy to a protected location, replace the credentials and certificate paths,
# then start with: newppp --config /etc/newppp/server.conf

mode = server

# Use a strong unique password in production.
auth = alice:CHANGE_THIS_PASSWORD

# WebTransport over QUIC. Omit this line for pure fallback mode.
listen = 0.0.0.0:443

# HTTPS POST/WebSocket fallback listener.
fallback-listen = 0.0.0.0:443

# Optional HTTP redirect and ACME http-01 listener.
http-listen = 0.0.0.0:80
# acme-dir = /var/www/acme

# Production certificate and private key.
cert = ./.pem
key = ./.key

path = /api/ppp
# Keep enough headroom for concurrent applications.
max-sessions = 200
max-unauth = 128

# 0 = unlimited. Set a finite value here if this account is shared.
rate = 0
idle = 60

# Lower to 2 on visibly lossy links.
recv-window = 2
shutdown-grace = 10
health = 127.0.0.1:9100
log = info

# Private and loopback targets are denied by default.
# allow-private-targets
