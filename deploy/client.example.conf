# newppp client example configuration
# Copy to a protected location, replace the credentials and server URLs,
# then start with: newppp --config /etc/newppp/client.conf
mode = client

# Must match one server-side auth entry.
# auth = AAA:123
# auth = BBB:123
auth = alice:CHANGE_THIS_PASSWORD

# WebTransport primary path and HTTPS POST fallback.
server = https://proxy.example.com:443
url = https://proxy.example.com/api/ppp

# Local proxy listeners.
bind = 127.0.0.1:1080
http-bind = 127.0.0.1:8081

# Two connections provide concurrency and failover without excessive
# heartbeat/reconnect overhead. Source CIDs remain safe for pooled traffic.
conns = 2

# Lower to 2 on visibly lossy links.
recv-window = 2
health = 127.0.0.1:9101
log = info

# For a Cloudflare-proxied fallback, use wss:// instead of https://.
# url = wss://proxy.example.com/api/ppp

# Development only with a self-signed server certificate.
# skip-verify

# Optional direct-path SNI masquerade. Requires pin or skip-verify.
# sni = cdn.example.com
# pin = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
