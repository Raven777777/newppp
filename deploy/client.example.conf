# =============================================================================
# newppp 客户端示例配置
# =============================================================================
# 使用方法：
#   1) 复制到受保护的位置，例如 /etc/newppp/client.conf（建议权限 600）；
#   2) 替换下面的账号密码、服务器地址与证书指纹；
#   3) 启动：newppp --config /etc/newppp/client.conf
#
# 语法说明：
#   * 每行格式为 KEY = VALUE，KEY 即命令行长选项名（去掉前缀 --）。
#   * 以 # 开头的整行是注释，空行忽略。
#     注意：注释必须单独成行——不写引号时，行内 # 之后的内容会被当成值的一部分。
#   * 布尔开关整行只写键名（也可写 KEY = true），不要给它赋值。
#   * 值可以用成对引号（'…' 或 "…"）包裹；引号之后的内容当作注释。
#   * 命令行参数优先于本文件；同一文件里靠后的同名键覆盖靠前的。
# =============================================================================

# 运行模式：client（等价于命令行 -c）
mode = client

# -----------------------------------------------------------------------------
# 认证（必填）
# -----------------------------------------------------------------------------
# 必须与服务端某个 auth 条目一致。uid 限 [A-Za-z0-9_-]{1,32}。
# 密码是内层加密密钥的根：请使用足够长且随机的字符串（推荐 64 位大小写字母数字混合）。
auth = alice:CHANGE_THIS_PASSWORD

# -----------------------------------------------------------------------------
# 出站通道（至少配置一个）
# -----------------------------------------------------------------------------
# WebTransport/QUIC 主通道：https://host[:port]
server = https://proxy.example.com:443

# 模式 A 兜底通道；scheme 决定承载方式：
#   https://  直连双工 POST（直连场景首选，性能最好）
#   wss://    WebSocket（套 Cloudflare 橙云时必须使用）
# 主通道失败时自动降级到该通道；不套 CF 时优先用直连 https://。
url = https://proxy.example.com/api/ppp

# 套 Cloudflare 橙云时改用 WebSocket 承载（CF 会缓冲完整 POST 请求体）：
# url = wss://proxy.example.com/api/ppp

# -----------------------------------------------------------------------------
# 本地入站监听
# -----------------------------------------------------------------------------
# SOCKS5（支持 CONNECT 与 UDP ASSOCIATE）
bind = 127.0.0.1:1080

# HTTP 代理（CONNECT + 简单转发，出口失败回 502）；不需要可整行注释掉
http-bind = 127.0.0.1:8081

# 本地入站认证（SOCKS5 RFC1929 用户名/密码 + HTTP 代理 Basic Auth）。
# 绑 0.0.0.0（NAS/局域网共享）时强烈建议开启：
# inbound-auth = user:pass

# -----------------------------------------------------------------------------
# 连接池
# -----------------------------------------------------------------------------
# 池大小 1..8。低频用户（浏览/视频/下载）建议 1：单条 QUIC 连接可承载 50 条会话，
# 默认 2 的收益只是并发冗余，代价是心跳与重拨开销翻倍；重度多任务再显式用 2。
conns = 2

# -----------------------------------------------------------------------------
# 传输调优
# -----------------------------------------------------------------------------
# QUIC 每流接收窗口 MB（1..=64，下载方向）：
#   优质高延迟线路可调大提速；高丢包调小抗 "too many gaps"。
#   该值同时决定 initial_max_stream_data TP——调大偏离浏览器常见值，指纹敏感部署保持 2。
recv-window = 2

# 明文帧负载上限 KB（16..=1024，默认 16）：
#   握手时与服务端协商取小值（协议 v2），两端都调大才生效；
#   调大后，超过路径 MTU 的大 UDP 数据报可整帧走可靠流。
# max-frame-kb = 16

# -----------------------------------------------------------------------------
# 内部时钟（两端时间需大致一致，否则认证被拒）
# -----------------------------------------------------------------------------
# 时间源 URL：读取响应的 HTTP Date 头校准内部时钟，默认 Cloudflare。
# 国内可换成淘宝时间接口：
# time = https://acs.m.taobao.com/gw/mtop.common.getTimestamp/

# -----------------------------------------------------------------------------
# 健康检查端点
# -----------------------------------------------------------------------------
# 明文 HTTP，建议仅绑定回环；/healthz 返回 JSON 快照，供 docker HEALTHCHECK 使用。
health = 127.0.0.1:9101

# -----------------------------------------------------------------------------
# 日志级别：trace | debug | info | warn | error
# -----------------------------------------------------------------------------
log = info

# -----------------------------------------------------------------------------
# 直连路径 SNI 伪装 + 证书 pinning（可选，二者通常配套使用）
# -----------------------------------------------------------------------------
# 伪装 SNI：TLS ClientHello 的 SNI 与 DNS 查询目标换成该域名，实际连接地址取自
# 原始 URL。须配合 pin（推荐）或调试用 skip-verify；与 wss:// 兜底互斥。
# sni = cdn.example.com

# 证书指纹 pinning（SHA-256，64 位 hex，容忍冒号分隔）：设置后完全替代 CA 校验，
# 服务器身份就是这枚证书。获取方法（在服务器上执行）：
#   openssl x509 -in cert.pem -noout -fingerprint -sha256
# 提醒：证书轮换（如 Let's Encrypt 续期）后指纹失效，客户端会全部拒绝连接。
# pin = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# -----------------------------------------------------------------------------
# 仅调试用
# -----------------------------------------------------------------------------
# 跳过 TLS 证书校验（配合服务端 --self-signed 本地测试；生产环境不要开启）
# skip-verify
