# newppp — nginx 前置（档位 1）
#
# 职责划分（nginx 无法代理 WebTransport/h3 会话，因此）：
#   * UDP 443 → stream 模块透传给后端（后端用同一证书终止 QUIC-TLS）
#   * TCP 443 → nginx 终止 TLS：/api/ppp 反代降级端点，其余路径服务伪装站
#
# 需要模块: http_ssl, http_v2, stream, stream_udp

user  www-data;
worker_processes auto;
events { worker_connections 1024; }

# ---------- UDP 443: QUIC/WebTransport 透传 ----------
stream {
    server {
        listen 443 udp reuseport;
        proxy_pass 127.0.0.1:8443;   # newppp --listen
        proxy_timeout 300s;
        proxy_responses 0;           # 无状态透传
    }
}

http {
    # ---------- TCP 443: 降级端点 + 伪装站 ----------
    server {
        listen 80;
        server_name your.domain;
        location /.well-known/acme-challenge/ { root /var/www/html; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name your.domain;

        ssl_certificate     /etc/letsencrypt/live/your.domain/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your.domain/privkey.pem;
        ssl_protocols TLSv1.3;

        # 降级端点（模式 A POST）—— 所有流式路径必须关闭缓冲
        location /api/ppp {
            proxy_pass http://127.0.0.1:8444;   # newppp --fallback-listen
            proxy_http_version 1.1;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            client_max_body_size 0;      # 双工流不限制
            client_body_buffer_size 128k;
        }

        # 其余路径：伪装站（未认证请求得到的也是这一页）
        location / {
            root /var/www/disguise;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
